version: "3.8"

services:
  goalflow:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./.goalflow:/app/.goalflow
      - ./repos:/repos
    environment:
      - GOALFLOW_MODE=auto
    command: ["uv", "run", "uvicorn", "goalflow.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

