[project]
name = "goalflow"
version = "0.1.0"
description = "GoalFlow — 目标锚定的全链路智能开发平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "transitions>=0.9.2",
    "pydantic>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "PyGithub>=2.1",
    "litellm>=1.0",
    "gitpython>=3.1",
    "aiohttp>=3.9",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]

[project.scripts]
goalflow = "goalflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["goalflow"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
